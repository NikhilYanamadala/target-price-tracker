plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
java.sourceCompatibility = JavaVersion.VERSION_17

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// Ensure static resources are included in JAR
sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

jar {
    enabled = false
}

// Optional: Task for local development (when npm is available)
task buildFrontendLocal(type: Exec) {
    group = 'build'
    description = 'Build Angular frontend for local development'
    
    workingDir '../frontend'
    
    // Only run if frontend directory exists and npm is available
    onlyIf {
        file('../frontend').exists() && 
        (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 
            new File('C:/Program Files/nodejs/npm.cmd').exists() || 
            new File('C:/Program Files (x86)/nodejs/npm.cmd').exists() :
            Runtime.getRuntime().exec("which npm").waitFor() == 0)
    }
    
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
        commandLine 'npm.cmd', 'run', 'build:backend'
    } else {
        commandLine 'npm', 'run', 'build:backend'
    }
    
    // Don't fail the build if this task fails
    ignoreExitValue = true
}

// Don't automatically depend on frontend build for Docker builds
// buildFrontendLocal can be run manually: ./gradlew buildFrontendLocal bootJar