name: Deploy Bundled App

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Test Frontend
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Test Frontend
        run: |
          cd frontend
          npm ci
          npm run test -- --no-watch --no-progress --browsers=ChromeHeadless

      # Test Backend
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Test Backend
        run: |
          cd backend
          ./gradlew test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Build bundled application
      - name: Build Bundled Application
        run: |
          cd backend
          ./gradlew bootJar

      # Deploy Infrastructure and Application
      - name: Install CDK Dependencies
        run: |
          cd infrastructure
          npm ci

      - name: Deploy to AWS
        run: |
          cd infrastructure
          npm run cdk bootstrap
          npm run deploy